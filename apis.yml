name: Beijing Lanweitong Technology (蓝卫通 / BSC)
description: >-
  Beijing Lanweitong Technology Co., Ltd. (北京蓝卫通科技有限公司), branded BSC, operates one of China's
  longest-running telemedicine networks — the 蓝卫通远程医学服务平台 (Lanweitong Remote Medical Service
  Platform). Founded in 1998 and headquartered in Beijing, the company connects thousands of
  member hospitals and clinics to specialist physicians at Grade-A tertiary hospitals for remote
  consultation (远程会诊), remote outpatient clinics, multidisciplinary MDT consultations, remote
  imaging and DICOM cloud reading, remote ECG, remote pathology, remote ultrasound, remote ward
  rounds, and continuing medical education. The platform is delivered as hospital-facing web
  applications (BSCTelmed, DicomCloud, BSCEcg, BSCUltrasound, BSCEdu) plus a mobile app, and is
  sold to health systems and medical alliances (医联体) rather than exposed as a public developer
  API. The company reports 19 patents and 199 software copyrights and has been recognized as a
  national-level "little giant" specialized enterprise. It was surfaced in the API Evangelist
  network as a Qiming Venture Partners portfolio company. Its original domain chinabsc.com is
  still registered but no longer resolves; the live platform runs on bsc1.cn / bscm.cn.
